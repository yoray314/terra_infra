---
name: Repository quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Verify OpenTofu version
        run: tofu version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Initialize resource-group example
        working-directory: examples/01-resource-group
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate resource-group example
        working-directory: examples/01-resource-group
        run: tofu validate -no-color

      - name: Initialize remote-state bootstrap
        working-directory: examples/02-remote-state/bootstrap
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate remote-state bootstrap
        working-directory: examples/02-remote-state/bootstrap
        run: tofu validate -no-color

      - name: Initialize remote-state workload
        working-directory: examples/02-remote-state/workload
        run: |
          cp backend-template/backend.tf backend.tf
          tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate remote-state workload
        working-directory: examples/02-remote-state/workload
        run: tofu validate -no-color

      - name: Initialize Key Vault example
        working-directory: examples/03-key-vault
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate Key Vault example
        working-directory: examples/03-key-vault
        run: tofu validate -no-color

      - name: Initialize OpenBao VM example
        working-directory: examples/04-openbao-vm
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate OpenBao VM example
        working-directory: examples/04-openbao-vm
        run: tofu validate -no-color

      - name: Validate OpenBao cloud-init template
        working-directory: modules/openbao-lab
        run: |
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' cloud-init.yaml.tftpl
          awk '/^      #!\/usr\/bin\/env bash$/{flag=1} flag{sub(/^      /,""); if (/^  - path: \/etc\/systemd\/system\/openbao-bootstrap.service$/) exit; print}' \
            cloud-init.yaml.tftpl > "${RUNNER_TEMP}/openbao-bootstrap"
          bash -n "${RUNNER_TEMP}/openbao-bootstrap"

      - name: Initialize OpenBao module tests
        working-directory: modules/openbao-lab
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Test OpenBao module
        working-directory: modules/openbao-lab
        run: tofu test -no-color

      - name: Initialize development environment
        working-directory: environments/dev
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate development environment
        working-directory: environments/dev
        run: tofu validate -no-color

      - name: Initialize test environment
        working-directory: environments/test
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate test environment
        working-directory: environments/test
        run: tofu validate -no-color

      - name: Validate comparison scripts
        run: bash -n examples/05-secrets-comparison/scripts/*.sh examples/05-secrets-comparison/scripts/*.bash

      - name: Initialize workload-identity example
        working-directory: examples/06-workload-identity
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate workload-identity example
        working-directory: examples/06-workload-identity
        run: tofu validate -no-color

      - name: Validate workload consumer template
        working-directory: examples/06-workload-identity
        run: |
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' cloud-init.yaml.tftpl
          awk '/^      #!\/usr\/bin\/env bash$/{flag=1} flag{sub(/^      /,""); print}' \
            cloud-init.yaml.tftpl > "${RUNNER_TEMP}/secret-consumer"
          bash -n "${RUNNER_TEMP}/secret-consumer"

      - name: Initialize private-networking example
        working-directory: examples/07-private-networking
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate private-networking example
        working-directory: examples/07-private-networking
        run: tofu validate -no-color

      - name: Initialize GitHub OIDC bootstrap
        working-directory: examples/08-github-oidc/bootstrap
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate GitHub OIDC bootstrap
        working-directory: examples/08-github-oidc/bootstrap
        run: tofu validate -no-color

      - name: Initialize GitHub OIDC workload
        working-directory: examples/08-github-oidc/workload
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate GitHub OIDC workload
        working-directory: examples/08-github-oidc/workload
        run: tofu validate -no-color

      - name: Initialize operations and observability example
        working-directory: examples/11-operations-observability
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate operations and observability example
        working-directory: examples/11-operations-observability
        run: tofu validate -no-color

      - name: Test operations and observability example
        working-directory: examples/11-operations-observability
        run: tofu test -no-color

      - name: Validate observability scripts
        run: bash -n examples/11-operations-observability/scripts/*.sh

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --message-length-limit 100 --rev-range "${BASE_SHA}..${HEAD_SHA}"

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: cz check --message-length-limit 100 --rev-range "${BASE_SHA}..${HEAD_SHA}"

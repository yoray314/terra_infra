---
name: Azure lab deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against the Example 08 workload
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: azure-lab-deployment
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_resource_group_name: ${{ vars.AZURE_WORKLOAD_RESOURCE_GROUP }}
  WORKING_DIRECTORY: examples/08-github-oidc/workload

jobs:
  plan:
    name: Read-only plan
    if: inputs.operation == 'plan' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Initialize remote state
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          tofu init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=${{ vars.AZURE_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_STATE_CONTAINER }}" \
            -backend-config="key=08-github-oidc/workload.tfstate"

      - name: Run read-only plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set +e
          tofu plan -input=false -lock=false -detailed-exitcode -no-color
          exit_code=$?
          set -e
          if [ "${exit_code}" -ne 0 ] && [ "${exit_code}" -ne 2 ]; then
            exit "${exit_code}"
          fi

  change:
    name: ${{ inputs.operation }} workload
    if: (inputs.operation == 'apply' || inputs.operation == 'destroy') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Initialize remote state
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          tofu init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=${{ vars.AZURE_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_STATE_CONTAINER }}" \
            -backend-config="key=08-github-oidc/workload.tfstate"

      - name: Plan requested change
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ "${{ inputs.operation }}" = "destroy" ]; then
            tofu plan -destroy -input=false -out=requested.tfplan
          else
            tofu plan -input=false -out=requested.tfplan
          fi

      - name: Apply generated plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: tofu apply -input=false requested.tfplan

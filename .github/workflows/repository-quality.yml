---
name: Repository quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Verify OpenTofu version
        run: tofu version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Initialize resource-group example
        working-directory: examples/01-resource-group
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate resource-group example
        working-directory: examples/01-resource-group
        run: tofu validate -no-color

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --message-length-limit 100 --rev-range "${BASE_SHA}..${HEAD_SHA}"

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: cz check --message-length-limit 100 --rev-range "${BASE_SHA}..${HEAD_SHA}"
